<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚬 Estanco Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }
        .btn {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn:hover { background: var(--accent); color: #0f172a; border-color: var(--accent); }
        .btn-primary { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }
        .btn-primary:hover { background: #7dd3fc; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem; }
        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4); }
        .kpi-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .kpi-value { font-size: 1.75rem; font-weight: 700; }
        .kpi-value.ingresos { color: var(--accent); }
        .kpi-value.beneficio { color: var(--success); }
        .kpi-value.rotacion { color: var(--warning); }
        .tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .tab {
            padding: 0.75rem 1.25rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.2s;
            background: none;
            border-top: none; border-left: none; border-right: none;
            font-size: 1rem;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }
        .panel h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
        .controls { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
        .controls label { color: var(--text-muted); font-size: 0.9rem; }
        select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.45rem 0.8rem;
            border-radius: 0.4rem;
            font-size: 0.95rem;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; background: rgba(255,255,255,0.02); }
        tr:hover td { background: rgba(255,255,255,0.03); }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .chart-container { position: relative; height: 360px; margin-top: 1rem; }
        .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 1.5rem; }
        .commentary {
            background: linear-gradient(135deg, #1e293b 0%, #172554 100%);
            border: 1px solid #1e40af;
            border-radius: 1rem;
            padding: 1.5rem;
            line-height: 1.8;
            color: #dbeafe;
        }
        .commentary h3 { color: var(--accent); margin-bottom: 0.75rem; }
        .commentary p { margin-bottom: 0.5rem; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 0.35rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-blue { background: rgba(56,189,248,0.15); color: var(--accent); }
        .badge-green { background: rgba(52,211,153,0.15); color: var(--success); }
        .badge-amber { background: rgba(251,191,36,0.15); color: var(--warning); }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
        @media (max-width: 640px) {
            .chart-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; align-items: flex-start; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">🚬 Estanco Analytics Dashboard</div>
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
            <div class="file-input-wrapper">
                <button class="btn btn-primary">📁 Subir CSV</button>
                <input type="file" id="csvInput" accept=".csv">
            </div>
            <button class="btn" onclick="loadDemoData()">🔄 Datos de ejemplo</button>
        </div>
    </header>

    <div class="container">
        <div class="kpis" id="kpiContainer">
            <div class="kpi-card">
                <div class="kpi-label">Ingresos Totales</div>
                <div class="kpi-value ingresos" id="kpiIngresos">—</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Beneficio Estimado</div>
                <div class="kpi-value beneficio" id="kpiBeneficio">—</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Rotación Media</div>
                <div class="kpi-value rotacion" id="kpiRotacion">—</div>
            </div>
        </div>

        <div class="tabs" id="tabs">
            <button class="tab active" data-tab="resumen">Resumen</button>
            <button class="tab" data-tab="productos">Productos</button>
            <button class="tab" data-tab="categorias">Categorías</button>
            <button class="tab" data-tab="graficos">Gráficos</button>
        </div>

        <!-- RESUMEN -->
        <div class="tab-panel active" id="tab-resumen">
            <div class="panel">
                <h2>📋 Todos los productos</h2>
                <div id="tableProductosContainer"></div>
            </div>
            <div class="panel">
                <h2>📊 Resumen por categoría</h2>
                <div id="tableCategoriasResumenContainer"></div>
            </div>
        </div>

        <!-- PRODUCTOS -->
        <div class="tab-panel" id="tab-productos">
            <div class="panel">
                <div class="controls">
                    <label>Ordenar por:</label>
                    <select id="prodSort">
                        <option value="unidades_vendidas">Unidades vendidas</option>
                        <option value="ingresos">Ingresos</option>
                        <option value="beneficio">Beneficio</option>
                        <option value="rotacion">Rotación</option>
                    </select>
                    <label>Top:</label>
                    <select id="prodTop">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                    </select>
                </div>
                <div id="tableProductosRankContainer"></div>
            </div>
        </div>

        <!-- CATEGORÍAS -->
        <div class="tab-panel" id="tab-categorias">
            <div class="panel">
                <div id="tableCategoriasContainer"></div>
            </div>
        </div>

        <!-- GRÁFICOS -->
        <div class="tab-panel" id="tab-graficos">
            <div class="chart-grid">
                <div class="panel">
                    <h2>📈 Por categoría</h2>
                    <div class="controls">
                        <label>Métrica:</label>
                        <select id="chartCatMetric">
                            <option value="ingresos_total">Ingresos</option>
                            <option value="beneficio_total">Beneficio</option>
                            <option value="unidades_total">Unidades</option>
                        </select>
                    </div>
                    <div class="chart-container"><canvas id="chartCategorias"></canvas></div>
                </div>
                <div class="panel">
                    <h2>🏆 Top productos</h2>
                    <div class="controls">
                        <label>Métrica:</label>
                        <select id="chartProdMetric">
                            <option value="unidades_vendidas">Unidades</option>
                            <option value="ingresos">Ingresos</option>
                            <option value="beneficio">Beneficio</option>
                            <option value="rotacion">Rotación</option>
                        </select>
                        <label>Top:</label>
                        <select id="chartProdTop">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                    <div class="chart-container"><canvas id="chartProductos"></canvas></div>
                </div>
            </div>
        </div>

        <div class="commentary" id="commentaryBox" style="margin-top:1rem;">
            <h3>💬 Comentario automático del negocio</h3>
            <div id="commentaryText">Cargando análisis...</div>
        </div>
    </div>

    <script>
        // ===================== CONFIG =====================
        const MARGENES = {
            tabaco_cajetilla: 0.085,
            tabaco_rollo: 0.09,
            puros: 0.09,
            sellos: 0.04,
            otros: 0.20
        };

        const DEMO_CSV = `producto,categoria,unidades_vendidas,precio_venta_unitario,stock_medio
Marlboro Rojo,tabaco_cajetilla,450,5.50,80
Camel Azul,tabaco_cajetilla,380,5.40,60
Lucky Strike,tabaco_cajetilla,290,5.30,45
Ducados Rubio,tabaco_cajetilla,210,5.20,35
Chesterfield,tabaco_cajetilla,150,5.10,25
Golden Virginia 30g,tabaco_rollo,120,8.50,20
Amber Leaf 30g,tabaco_rollo,95,8.20,15
Samson 30g,tabaco_rollo,60,7.90,10
Puro Romeo y Julieta,puros,45,12.00,8
Puro Montecristo,puros,30,15.00,5
Puro Cohiba,puros,18,25.00,3
Sello Normal A,sellos,800,0.85,200
Sello Tarifa B,sellos,650,1.15,150
Sello Certificado,sellos,320,2.50,80
Sello Internacional,sellos,180,3.80,40
Mechero Clipper,otros,200,2.00,50
Papel de liar OCB,otros,350,1.50,60
Filtros Swan,otros,280,1.20,40
Encendedor Bic,otros,420,1.80,70
Cenicero cristal,otros,85,6.50,15
Cerveza Rubia (lata),otros,600,1.10,100
Gominolas surtidas,otros,310,1.00,55`;

        // ===================== STATE =====================
        let rawData = [];
        let chartCatInstance = null;
        let chartProdInstance = null;

        // ===================== UTILS =====================
        function fmtMoney(n) {
            return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(n);
        }
        function fmtNum(n, dec = 2) {
            return new Intl.NumberFormat('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n);
        }

        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/);
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const out = [];
            for (let i = 1; i < lines.length; i++) {
                const row = lines[i].split(',');
                if (row.length < headers.length) continue;
                const obj = {};
                headers.forEach((h, idx) => {
                    let v = row[idx] ? row[idx].trim() : '';
                    if (['unidades_vendidas','precio_venta_unitario','stock_medio'].includes(h)) {
                        obj[h] = parseFloat(v.replace(',', '.')) || 0;
                    } else {
                        obj[h] = v;
                    }
                });
                out.push(obj);
            }
            return out;
        }

        function computeRows(rows) {
            return rows.map(r => {
                const ingresos = r.unidades_vendidas * r.precio_venta_unitario;
                const margen_pct = MARGENES[r.categoria] !== undefined ? MARGENES[r.categoria] : 0.20;
                const beneficio = ingresos * margen_pct;
                const rotacion = r.stock_medio > 0 ? r.unidades_vendidas / r.stock_medio : 0;
                return { ...r, ingresos, margen_pct, beneficio, rotacion };
            });
        }

        function aggregateByCategory(rows) {
            const map = {};
            rows.forEach(r => {
                if (!map[r.categoria]) map[r.categoria] = { categoria: r.categoria, ingresos_total: 0, beneficio_total: 0, unidades_total: 0, rotacion_sum: 0, count: 0 };
                map[r.categoria].ingresos_total += r.ingresos;
                map[r.categoria].beneficio_total += r.beneficio;
                map[r.categoria].unidades_total += r.unidades_vendidas;
                map[r.categoria].rotacion_sum += r.rotacion;
                map[r.categoria].count += 1;
            });
            return Object.values(map).map(x => ({
                ...x,
                rotacion_media: x.rotacion_sum / x.count
            }));
        }

        // ===================== RENDER =====================
        function renderKpis(rows) {
            const totalIngresos = rows.reduce((s, r) => s + r.ingresos, 0);
            const totalBeneficio = rows.reduce((s, r) => s + r.beneficio, 0);
            const avgRotacion = rows.length ? rows.reduce((s, r) => s + r.rotacion, 0) / rows.length : 0;
            document.getElementById('kpiIngresos').textContent = fmtMoney(totalIngresos);
            document.getElementById('kpiBeneficio').textContent = fmtMoney(totalBeneficio);
            document.getElementById('kpiRotacion').textContent = fmtNum(avgRotacion, 2);
        }

        function buildTable(headers, rows, formatters = {}) {
            if (!rows.length) return '<div class="empty-state">No hay datos para mostrar.</div>';
            let html = '<div style="overflow-x:auto;"><table><thead><tr>';
            headers.forEach(h => html += `<th>${h.label}</th>`);
            html += '</tr></thead><tbody>';
            rows.forEach(row => {
                html += '<tr>';
                headers.forEach(h => {
                    let val = row[h.key];
                    if (formatters[h.key]) val = formatters[h.key](val);
                    const align = typeof val === 'number' || (typeof val === 'string' && val.includes('€')) ? 'num' : '';
                    html += `<td class="${align}">${val}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            return html;
        }

        function renderProductosTable(rows) {
            const headers = [
                { key: 'producto', label: 'Producto' },
                { key: 'categoria', label: 'Categoría' },
                { key: 'unidades_vendidas', label: 'Unidades' },
                { key: 'precio_venta_unitario', label: 'PVP' },
                { key: 'stock_medio', label: 'Stock medio' },
                { key: 'ingresos', label: 'Ingresos' },
                { key: 'margen_pct', label: 'Margen %' },
                { key: 'beneficio', label: 'Beneficio' },
                { key: 'rotacion', label: 'Rotación' },
            ];
            const fmt = {
                precio_venta_unitario: v => fmtMoney(v),
                ingresos: v => fmtMoney(v),
                beneficio: v => fmtMoney(v),
                margen_pct: v => fmtNum(v * 100, 1) + '%',
                rotacion: v => fmtNum(v, 2),
                categoria: v => `<span class="badge badge-blue">${v}</span>`
            };
            document.getElementById('tableProductosContainer').innerHTML = buildTable(headers, rows, fmt);
        }

        function renderCategoriasTable(catRows) {
            const headers = [
                { key: 'categoria', label: 'Categoría' },
                { key: 'ingresos_total', label: 'Ingresos' },
                { key: 'beneficio_total', label: 'Beneficio' },
                { key: 'unidades_total', label: 'Unidades' },
                { key: 'rotacion_media', label: 'Rotación media' },
            ];
            const fmt = {
                ingresos_total: v => fmtMoney(v),
                beneficio_total: v => fmtMoney(v),
                rotacion_media: v => fmtNum(v, 2),
                categoria: v => `<span class="badge badge-blue">${v}</span>`
            };
            const html = buildTable(headers, catRows, fmt);
            document.getElementById('tableCategoriasResumenContainer').innerHTML = html;
            document.getElementById('tableCategoriasContainer').innerHTML = html;
        }

        function renderProductosRank(rows) {
            const sortKey = document.getElementById('prodSort').value;
            const topN = parseInt(document.getElementById('prodTop').value);
            const sorted = [...rows].sort((a, b) => b[sortKey] - a[sortKey]).slice(0, topN);
            const headers = [
                { key: 'rank', label: '#' },
                { key: 'producto', label: 'Producto' },
                { key: 'categoria', label: 'Categoría' },
                { key: sortKey, label: sortKey.replace('_', ' ') },
            ];
            const data = sorted.map((r, i) => ({ rank: i + 1, producto: r.producto, categoria: r.categoria, [sortKey]: r[sortKey] }));
            const fmt = {
                [sortKey]: v => (sortKey === 'ingresos' || sortKey === 'beneficio') ? fmtMoney(v) : fmtNum(v, 2),
                categoria: v => `<span class="badge badge-blue">${v}</span>`
            };
            document.getElementById('tableProductosRankContainer').innerHTML = buildTable(headers, data, fmt);
        }

        function renderCommentary(rows, catRows) {
            const totalIngresos = rows.reduce((s, r) => s + r.ingresos, 0);
            const totalBeneficio = rows.reduce((s, r) => s + r.beneficio, 0);
            const avgRotacion = rows.length ? rows.reduce((s, r) => s + r.rotacion, 0) / rows.length : 0;

            const topCatIngresos = [...catRows].sort((a, b) => b.ingresos_total - a.ingresos_total)[0];
            const topCatBeneficio = [...catRows].sort((a, b) => b.beneficio_total - a.beneficio_total)[0];

            let rotText = '';
            if (avgRotacion > 8) rotText = 'La rotación media es muy alta, lo que indica una excelente velocidad de venta. Considera aumentar stock de los productos estrella para no quedarte sin existencias.';
            else if (avgRotacion > 4) rotText = 'La rotación media es buena, mostrando un flujo de ventas saludable. Revisa los productos con rotación baja para optimizar el espacio de exposición.';
            else if (avgRotacion > 2) rotText = 'La rotación media es moderada. Algunos productos podrían estar acumulando stock innecesario; valora promociones o ajustes de surtido.';
            else rotText = 'La rotación media es baja. Es recomendable revisar el surtido, reducir stock de referencias lentas y potenciar las de mayor demanda.';

            const html = `
                <p>📊 <strong>Ingresos totales:</strong> ${fmtMoney(totalIngresos)}. <strong>Beneficio estimado:</strong> ${fmtMoney(totalBeneficio)}.</p>
                <p>🏆 La categoría que lidera en <strong>ingresos</strong> es <span class="badge badge-green">${topCatIngresos ? topCatIngresos.categoria : '—'}</span> con ${fmtMoney(topCatIngresos ? topCatIngresos.ingresos_total : 0)}.</p>
                <p>💰 La categoría que lidera en <strong>beneficio</strong> es <span class="badge badge-green">${topCatBeneficio ? topCatBeneficio.categoria : '—'}</span> con ${fmtMoney(topCatBeneficio ? topCatBeneficio.beneficio_total : 0)}.</p>
                <p>🔄 ${rotText}</p>
                <p>💡 <strong>Recomendación general:</strong> Mantén un control periódico del stock medio y prioriza la reposición de las categorías con mayor rotación. Los productos de bajo margen pero alto volumen (como sellos o tabaco) compensan con el flujo de clientes.</p>
            `;
            document.getElementById('commentaryText').innerHTML = html;
        }

        // ===================== CHARTS =====================
        function renderChartCategorias(catRows) {
            const metric = document.getElementById('chartCatMetric').value;
            const labels = catRows.map(r => r.categoria);
            const data = catRows.map(r => r[metric]);
            const labelMap = { ingresos_total: 'Ingresos (€)', beneficio_total: 'Beneficio (€)', unidades_total: 'Unidades' };
            const ctx = document.getElementById('chartCategorias').getContext('2d');
            if (chartCatInstance) chartCatInstance.destroy();
            chartCatInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: labelMap[metric],
                        data,
                        backgroundColor: 'rgba(56, 189, 248, 0.6)',
                        borderColor: 'rgba(56, 189, 248, 1)',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f1f5f9',
                            bodyColor: '#cbd5e1',
                            borderColor: '#334155',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        function renderChartProductos(rows) {
            const metric = document.getElementById('chartProdMetric').value;
            const topN = parseInt(document.getElementById('chartProdTop').value);
            const sorted = [...rows].sort((a, b) => b[metric] - a[metric]).slice(0, topN);
            const labels = sorted.map(r => r.producto);
            const data = sorted.map(r => r[metric]);
            const labelMap = {
                unidades_vendidas: 'Unidades vendidas',
                ingresos: 'Ingresos (€)',
                beneficio: 'Beneficio (€)',
                rotacion: 'Rotación'
            };
            const ctx = document.getElementById('chartProductos').getContext('2d');
            if (chartProdInstance) chartProdInstance.destroy();
            chartProdInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: labelMap[metric],
                        data,
                        backgroundColor: 'rgba(52, 211, 153, 0.6)',
                        borderColor: 'rgba(52, 211, 153, 1)',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f1f5f9',
                            bodyColor: '#cbd5e1',
                            borderColor: '#334155',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8', maxRotation: 45, minRotation: 30 }
                        }
                    }
                }
            });
        }

        // ===================== MAIN =====================
        function updateAll(rows) {
            rawData = rows;
            const computed = computeRows(rows);
            const catAgg = aggregateByCategory(computed);

            renderKpis(computed);
            renderProductosTable(computed);
            renderCategoriasTable(catAgg);
            renderProductosRank(computed);
            renderChartCategorias(catAgg);
            renderChartProductos(computed);
            renderCommentary(computed, catAgg);
        }

        function loadDemoData() {
            const rows = parseCSV(DEMO_CSV);
            updateAll(rows);
        }

        document.getElementById('csvInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const rows = parseCSV(ev.target.result);
                if (!rows.length) {
                    alert('El CSV parece estar vacío o mal formado. Asegúrate de que tiene cabeceras y datos.');
                    return;
                }
                updateAll(rows);
            };
            reader.readAsText(file);
        });

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                // Re-render charts when tab becomes visible to fix canvas sizing
                if (tab.dataset.tab === 'graficos' && rawData.length) {
                    const computed = computeRows(rawData);
                    const catAgg = aggregateByCategory(computed);
                    renderChartCategorias(catAgg);
                    renderChartProductos(computed);
                }
            });
        });

        // Controls
        ['prodSort', 'prodTop'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => {
                if (rawData.length) renderProductosRank(computeRows(rawData));
            });
        });
        ['chartCatMetric'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => {
                if (rawData.length) renderChartCategorias(aggregateByCategory(computeRows(rawData)));
            });
        });
        ['chartProdMetric', 'chartProdTop'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => {
                if (rawData.length) renderChartProductos(computeRows(rawData));
            });
        });

        // Init
        loadDemoData();
    </script>
</body>
</html>
